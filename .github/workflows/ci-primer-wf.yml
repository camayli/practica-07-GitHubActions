name: Workflow Windows

on: [push, workflow_dispatch] # Define cuándo se ejecuta (ej: al hacer push o manual)

jobs:
  comandos_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: PowerShell
        run: |
          Get-Location
          Get-ChildItem
        shell: powershell

